fixture_name: business_ops_expansion_workflows
corpus_globs:
  - "corpus/**/*.md"
workflows:
  - id: bank_credit_exception_review
    title: "Bank credit exception review"
    archetype: case_evidence_adjudication
    split: holdout
    difficulty: 5
    challenge_tags:
      - banking_credit_packet
      - exception_authority
      - stale_loan_decoy
      - missing_tax_return
    failure_modes:
      - wrong_scope
      - shallow_relevance
      - absence_hallucination
      - missing_synthesis
    task_variants:
      - "Can Northstar close L-8821 with the tax-return exception?"
      - "Find the current borrower, credit exception authority, collateral requirements, and missing items."
      - "Do not use the archived Northstar Dental Partners approval."
    decoy_sources:
      - "corpus/decoy-old-loan-file.md"
    prompt: "Assemble the credit packet context for Loan Package L-8821."
    slots:
      - id: loan_identity
        slot_kind: scope_check
        role: identity
        purpose: "Find the current loan package and borrower identity."
        required: true
        max_tokens: 900
        failure_modes: [wrong_scope]
        fields: [loan_id, borrower_name]
        queries:
          - "L-8821 Northstar Dental Group current borrower requested facility"
      - id: exception_authority
        slot_kind: evidence
        role: rules
        purpose: "Find whether the tax-return exception can be approved and which exposure threshold applies."
        required: true
        max_tokens: 1200
        failure_modes: [missing_synthesis, shallow_relevance]
        fields: [requested_tax_exception, tax_return_exception_authority, closing_exposure_threshold]
        queries:
          - "2025 tax return pending CPA compiled statements credit manager exception under $500000"
      - id: collateral_conditions
        slot_kind: evidence
        role: constraints
        purpose: "Find collateral appraisal requirements and exclusions for the equipment line."
        required: true
        max_tokens: 1100
        failure_modes: [missing_synthesis]
        fields: [advance_rate, appraisal_age_rule, excluded_assets]
        queries:
          - "equipment line appraisal 83% advance rate no older than 90 days excluded sterilization units"
      - id: missing_credit_items
        slot_kind: missing_check
        role: missing_context
        purpose: "Check which underwriting documents are absent from the packet."
        required: true
        max_tokens: 900
        failure_modes: [absence_hallucination]
        fields: [missing_2025_tax_return, missing_guarantor_liquidity]
        queries:
          - "L-8821 missing 2025 business tax return guarantor liquidity statement"
    fields:
      - id: loan_id
        label: "Loan ID"
        expected_status: answerable
        expected_value: "L-8821"
        evidence:
          - source: "corpus/loan-application.md"
            heading_path: ["Loan Package L-8821", "Applicant Identity"]
            required_text: "Loan ID: L-8821"
      - id: borrower_name
        label: "Borrower"
        expected_status: answerable
        expected_value: "Northstar Dental Group LLC"
        evidence:
          - source: "corpus/loan-application.md"
            heading_path: ["Loan Package L-8821", "Applicant Identity"]
            required_text: "Borrower: Northstar Dental Group LLC"
      - id: requested_tax_exception
        label: "Requested tax exception"
        expected_status: answerable
        expected_value: "accept 2024 CPA compiled statements while the 2025 business tax return is pending"
        evidence:
          - source: "corpus/loan-application.md"
            heading_path: ["Loan Package L-8821", "Borrower Request"]
            required_text: "accept 2024 CPA compiled statements while the 2025 business tax return is pending"
      - id: tax_return_exception_authority
        label: "Tax return exception authority"
        expected_status: answerable
        expected_value: "credit manager may approve if CPA compiled statements are present and exposure is under $500,000"
        evidence:
          - source: "corpus/credit-policy.md"
            heading_path: ["Small Business Credit Policy", "Exception Authority"]
            required_text: "credit manager may approve a temporary tax-return exception"
      - id: closing_exposure_threshold
        label: "Closing exposure threshold"
        expected_status: answerable
        expected_value: "under $500,000"
        evidence:
          - source: "corpus/credit-policy.md"
            heading_path: ["Small Business Credit Policy", "Exception Authority"]
            required_text: "closing exposure is under $500,000"
          - source: "corpus/loan-application.md"
            heading_path: ["Loan Package L-8821", "Applicant Identity"]
            required_text: "Requested Facility: $425,000 equipment line"
      - id: advance_rate
        label: "Advance rate"
        expected_status: answerable
        expected_value: "83%"
        evidence:
          - source: "corpus/collateral-appraisal.md"
            heading_path: ["Equipment Appraisal", "Value Opinion"]
            required_text: "Requested advance rate: 83%"
      - id: appraisal_age_rule
        label: "Appraisal age rule"
        expected_status: answerable
        expected_value: "appraisal no older than 90 days if advance rate exceeds 75%"
        evidence:
          - source: "corpus/credit-policy.md"
            heading_path: ["Small Business Credit Policy", "Collateral Rule"]
            required_text: "appraisal no older than 90 days if the advance rate exceeds 75%"
      - id: excluded_assets
        label: "Excluded assets"
        expected_status: answerable
        expected_value: "two sterilization units still on backorder"
        evidence:
          - source: "corpus/collateral-appraisal.md"
            heading_path: ["Equipment Appraisal", "Conditions"]
            required_text: "excludes two sterilization units still on backorder"
      - id: missing_2025_tax_return
        label: "Missing 2025 tax return"
        expected_status: missing
        searched_scope:
          - source: "corpus/loan-application.md"
            heading_path: ["Loan Package L-8821", "Missing Items"]
            required_text: "No signed 2025 business tax return appears in the packet"
          - source: "corpus/loan-application.md"
            heading_path: ["Loan Package L-8821", "Borrower Request"]
            required_text: "2025 business tax return is pending"
        unsearched_scope:
          - "Bank document-management system outside the supplied packet"
        review_reason: "The supplied packet does not contain the filed 2025 business tax return."
      - id: missing_guarantor_liquidity
        label: "Missing guarantor liquidity"
        expected_status: missing
        searched_scope:
          - source: "corpus/loan-application.md"
            heading_path: ["Loan Package L-8821", "Missing Items"]
            required_text: "No guarantor liquidity statement appears in the packet"
        unsearched_scope:
          - "External guarantor file outside the supplied packet"
        review_reason: "The packet says no guarantor liquidity statement appears."

  - id: vega_service_credit_review
    title: "Vega service credit review"
    archetype: case_evidence_adjudication
    split: dev
    difficulty: 5
    challenge_tags:
      - support_sla
      - missing_rca
      - customer_impact
      - contractual_rule_application
    failure_modes:
      - missing_synthesis
      - false_completeness
      - absence_hallucination
      - citation_weakness
    task_variants:
      - "Can the team evaluate a Vega P1 service credit yet?"
      - "Pull the SLA rule, incident status, impact, and missing incident documents."
    decoy_sources:
      - "corpus/decoy-template-dpa.md"
    prompt: "Assemble context for deciding whether Vega has enough evidence for a service credit review."
    slots:
      - id: vega_contract_scope
        slot_kind: scope_check
        role: identity
        purpose: "Find the Vega agreement and product scope."
        required: true
        max_tokens: 900
        failure_modes: [wrong_scope]
        fields: [service_credit_customer, vega_agreement_id, vega_service_product]
        queries:
          - "Vega Robotics VF-221 Automation Cloud agreement customer identity"
      - id: service_credit_rule
        slot_kind: evidence
        role: rules
        purpose: "Find the SLA response target and service credit documentation rule."
        required: true
        max_tokens: 1000
        failure_modes: [shallow_relevance]
        fields: [p1_response_target, service_credit_required_docs]
        queries:
          - "P1 response target service credit requires incident report customer impact summary"
      - id: vega_incident_status
        slot_kind: evidence
        role: current_state
        purpose: "Find current incident status and customer impact from the escalation."
        required: true
        max_tokens: 1100
        failure_modes: [missing_synthesis]
        fields: [vega_escalation_status, vega_customer_impact]
        queries:
          - "ESC-442 patch deployed customer validation pending five APAC sites paused reports"
      - id: service_credit_missing_docs
        slot_kind: missing_check
        role: missing_context
        purpose: "Check whether the RCA or incident report is still missing."
        required: true
        max_tokens: 900
        failure_modes: [absence_hallucination, false_completeness]
        fields: [rca_not_sent]
        queries:
          - "ESC-442 no final root cause analysis sent incident report missing"
    fields:
      - id: service_credit_customer
        label: "Service credit customer"
        expected_status: answerable
        expected_value: "Vega Robotics"
        evidence:
          - source: "corpus/vega-order-form.md"
            heading_path: ["Vega Order Form VF-221", "Customer Identity"]
            required_text: "Customer: Vega Robotics"
      - id: vega_agreement_id
        label: "Vega agreement ID"
        expected_status: answerable
        expected_value: "VF-221"
        evidence:
          - source: "corpus/vega-order-form.md"
            heading_path: ["Vega Order Form VF-221", "Customer Identity"]
            required_text: "Agreement ID: VF-221"
      - id: vega_service_product
        label: "Vega service product"
        expected_status: answerable
        expected_value: "Automation Cloud"
        evidence:
          - source: "corpus/vega-order-form.md"
            heading_path: ["Vega Order Form VF-221", "Customer Identity"]
            required_text: "Product: Automation Cloud"
      - id: p1_response_target
        label: "P1 response target"
        expected_status: answerable
        expected_value: "1 hour"
        evidence:
          - source: "corpus/vega-order-form.md"
            heading_path: ["Vega Order Form VF-221", "Support SLA"]
            required_text: "P1 response target: 1 hour"
      - id: service_credit_required_docs
        label: "Service credit required documents"
        expected_status: answerable
        expected_value: "incident report and customer impact summary"
        evidence:
          - source: "corpus/vega-order-form.md"
            heading_path: ["Vega Order Form VF-221", "Support SLA"]
            required_text: "requires an incident report and customer impact summary"
      - id: vega_escalation_status
        label: "Escalation status"
        expected_status: answerable
        expected_value: "patch deployed; customer validation pending"
        evidence:
          - source: "corpus/support-escalation.md"
            heading_path: ["Vega Support Escalation ESC-442", "Current Status"]
            required_text: "Patch deployed on 2026-06-02"
          - source: "corpus/support-escalation.md"
            heading_path: ["Vega Support Escalation ESC-442", "Current Status"]
            required_text: "Customer validation is still pending"
      - id: vega_customer_impact
        label: "Customer impact"
        expected_status: answerable
        expected_value: "five APAC sites paused weekly automation reports"
        evidence:
          - source: "corpus/support-escalation.md"
            heading_path: ["Vega Support Escalation ESC-442", "Customer Impact"]
            required_text: "Five APAC sites paused weekly automation reports"
      - id: rca_not_sent
        label: "RCA not sent"
        expected_status: missing
        searched_scope:
          - source: "corpus/support-escalation.md"
            heading_path: ["Vega Support Escalation ESC-442", "RCA"]
            required_text: "No final root-cause analysis has been sent"
        unsearched_scope:
          - "Engineering incident system outside the packet"
        review_reason: "The support packet does not contain a final RCA."

  - id: metrica_subprocessor_notice_review
    title: "Metrica subprocessor notice review"
    archetype: contract_policy_obligation_review
    split: holdout
    difficulty: 5
    challenge_tags:
      - signed_contract_authority
      - template_decoy
      - data_location
      - ai_training_restriction
    failure_modes:
      - wrong_scope
      - shallow_relevance
      - override_failure
      - citation_weakness
    task_variants:
      - "What notice does Metrica get before a material subprocessor is added?"
      - "Use signed Metrica documents, not the template DPA."
      - "Check AI training and data location restrictions."
    decoy_sources:
      - "corpus/decoy-template-dpa.md"
    prompt: "Assemble signed-contract context for Metrica data-processing obligations."
    slots:
      - id: signed_agreement_scope
        slot_kind: scope_check
        role: identity
        purpose: "Find the signed customer agreement scope for Metrica."
        required: true
        max_tokens: 900
        failure_modes: [wrong_scope]
        fields: [metrica_signed_customer, metrica_effective_date]
        queries:
          - "Metrica Labs signed order form effective date OF-774"
      - id: subprocessor_obligation
        slot_kind: evidence
        role: rules
        purpose: "Find subprocessor notice and objection rights from the signed DPA."
        required: true
        max_tokens: 1000
        failure_modes: [shallow_relevance, override_failure]
        fields: [subprocessor_notice_days, subprocessor_objection_right]
        queries:
          - "Metrica Data Protection Addendum material subprocessor 30 days notice objection"
      - id: data_use_restrictions
        slot_kind: evidence
        role: constraints
        purpose: "Find data location, sale, and AI training restrictions."
        required: true
        max_tokens: 1200
        failure_modes: [missing_synthesis]
        fields: [metrica_data_location, no_customer_data_sale, no_ai_training]
        queries:
          - "Metrica regulated customer data US EU no sale no generalized AI model training"
      - id: template_authority_check
        slot_kind: missing_check
        role: missing_context
        purpose: "Check whether the 15-day template notice is binding for this customer."
        required: true
        max_tokens: 900
        failure_modes: [wrong_scope, override_failure]
        fields: [template_notice_not_binding]
        queries:
          - "template DPA 15 days notice not binding does not amend signed customer agreement"
    fields:
      - id: metrica_signed_customer
        label: "Signed customer"
        expected_status: answerable
        expected_value: "Metrica Labs"
        evidence:
          - source: "corpus/contract-order-form.md"
            heading_path: ["Metrica Order Form OF-774", "Customer Identity"]
            required_text: "Customer: Metrica Labs"
      - id: metrica_effective_date
        label: "Effective date"
        expected_status: answerable
        expected_value: "2026-05-01"
        evidence:
          - source: "corpus/contract-order-form.md"
            heading_path: ["Metrica Order Form OF-774", "Customer Identity"]
            required_text: "Effective Date: 2026-05-01"
      - id: subprocessor_notice_days
        label: "Subprocessor notice days"
        expected_status: answerable
        expected_value: "30 days"
        evidence:
          - source: "corpus/privacy-addendum.md"
            heading_path: ["Metrica Data Protection Addendum", "Subprocessors"]
            required_text: "30 days notice before adding a material subprocessor"
      - id: subprocessor_objection_right
        label: "Subprocessor objection right"
        expected_status: answerable
        expected_value: "Customer may object in writing for reasonable data-protection concerns"
        evidence:
          - source: "corpus/privacy-addendum.md"
            heading_path: ["Metrica Data Protection Addendum", "Subprocessors"]
            required_text: "Customer may object in writing for reasonable data-protection concerns"
      - id: metrica_data_location
        label: "Data location"
        expected_status: answerable
        expected_value: "United States or European Union regions listed in the order form"
        evidence:
          - source: "corpus/privacy-addendum.md"
            heading_path: ["Metrica Data Protection Addendum", "Data Location"]
            required_text: "United States or European Union regions listed in the order form"
      - id: no_customer_data_sale
        label: "No customer data sale"
        expected_status: answerable
        expected_value: "Provider may not sell Customer Data"
        evidence:
          - source: "corpus/contract-msa.md"
            heading_path: ["Metrica Master Services Agreement", "Data Use"]
            required_text: "Provider may not sell Customer Data"
      - id: no_ai_training
        label: "No AI training"
        expected_status: answerable
        expected_value: "Customer Data may not be used to train generalized AI models"
        evidence:
          - source: "corpus/privacy-addendum.md"
            heading_path: ["Metrica Data Protection Addendum", "AI Training"]
            required_text: "Customer Data may not be used to train generalized AI models"
      - id: template_notice_not_binding
        label: "Template notice not binding"
        expected_status: missing
        searched_scope:
          - source: "corpus/decoy-template-dpa.md"
            heading_path: ["Template Data Processing Addendum", "Template Subprocessors"]
            required_text: "15 days notice before adding a new subprocessor"
          - source: "corpus/decoy-template-dpa.md"
            heading_path: ["Template Data Processing Addendum", "Non-Binding Status"]
            required_text: "does not amend, override, or interpret any signed customer agreement"
        unsearched_scope:
          - "Legal amendment repository outside the supplied packet"
        review_reason: "The 15-day template language is not binding without a signed amendment."

  - id: metrica_renewal_notice_obligation
    title: "Metrica renewal notice obligation"
    archetype: contract_policy_obligation_review
    split: stress
    difficulty: 4
    challenge_tags:
      - renewal_notice
      - commercial_limits
      - liability_exception
      - clause_synthesis
    failure_modes:
      - shallow_relevance
      - missing_synthesis
      - citation_weakness
    task_variants:
      - "When must Metrica send non-renewal notice?"
      - "Find renewal timing, overage cap, and liability carve-outs."
    decoy_sources:
      - "corpus/decoy-template-dpa.md"
    prompt: "Assemble Metrica renewal and commercial obligation context."
    slots:
      - id: renewal_terms
        slot_kind: evidence
        role: rules
        purpose: "Find subscription term end and non-renewal notice requirement."
        required: true
        max_tokens: 1000
        failure_modes: [missing_synthesis]
        fields: [initial_term_end, non_renewal_notice_days]
        queries:
          - "Metrica initial term end 2027-04-30 auto-renewal 60 days non-renewal notice"
      - id: commercial_constraints
        slot_kind: evidence
        role: constraints
        purpose: "Find overage cap and liability cap carve-outs."
        required: true
        max_tokens: 1200
        failure_modes: [shallow_relevance, citation_weakness]
        fields: [overage_cap, liability_cap_base, liability_carveouts]
        queries:
          - "Metrica overage fees capped 18000 liability cap fees prior 12 months confidentiality security breach payment obligations"
    fields:
      - id: initial_term_end
        label: "Initial term end"
        expected_status: answerable
        expected_value: "2027-04-30"
        evidence:
          - source: "corpus/contract-order-form.md"
            heading_path: ["Metrica Order Form OF-774", "Subscription"]
            required_text: "Initial term end: 2027-04-30"
      - id: non_renewal_notice_days
        label: "Non-renewal notice days"
        expected_status: answerable
        expected_value: "60 days before term end"
        evidence:
          - source: "corpus/contract-order-form.md"
            heading_path: ["Metrica Order Form OF-774", "Subscription"]
            required_text: "60 days non-renewal notice before the term end"
      - id: overage_cap
        label: "Overage cap"
        expected_status: answerable
        expected_value: "$18,000 per contract year"
        evidence:
          - source: "corpus/contract-order-form.md"
            heading_path: ["Metrica Order Form OF-774", "Commercial Limits"]
            required_text: "Overage fees are capped at $18,000 per contract year"
      - id: liability_cap_base
        label: "Liability cap base"
        expected_status: answerable
        expected_value: "fees paid in the prior 12 months"
        evidence:
          - source: "corpus/contract-msa.md"
            heading_path: ["Metrica Master Services Agreement", "Liability Cap"]
            required_text: "capped at fees paid in the prior 12 months"
      - id: liability_carveouts
        label: "Liability cap carve-outs"
        expected_status: answerable
        expected_value: "confidentiality obligations, security breach indemnity, and payment obligations"
        evidence:
          - source: "corpus/contract-msa.md"
            heading_path: ["Metrica Master Services Agreement", "Liability Cap"]
            required_text: "does not apply to confidentiality obligations, security breach indemnity, or payment obligations"

  - id: orion_three_way_match_review
    title: "Orion three-way match review"
    archetype: numeric_transaction_reconciliation
    split: holdout
    difficulty: 5
    challenge_tags:
      - invoice_po_receipt
      - row_level_numbers
      - prior_invoice_decoy
      - quantity_variance
    failure_modes:
      - numeric_text_split
      - wrong_scope
      - missing_synthesis
    task_variants:
      - "Can AP pay INV-ORION-331 against PO-8831?"
      - "Find invoice total, PO limits, receiving quantities, and variances."
      - "Do not use the prior April Orion invoice."
    decoy_sources:
      - "corpus/decoy-prior-invoice-orion.md"
    prompt: "Assemble the AP three-way match context for INV-ORION-331."
    slots:
      - id: invoice_scope
        slot_kind: scope_check
        role: identity
        purpose: "Find the current invoice and purchase order identity."
        required: true
        max_tokens: 900
        failure_modes: [wrong_scope]
        fields: [orion_invoice_id, orion_po_id, orion_vendor]
        queries:
          - "INV-ORION-331 PO-8831 Orion Display Supply current invoice"
      - id: invoice_amounts
        slot_kind: evidence
        role: evidence
        purpose: "Find invoice line quantities, freight, tax, and total."
        required: true
        max_tokens: 1200
        failure_modes: [numeric_text_split]
        fields: [invoice_monitor_line, invoice_mount_line, invoice_freight, invoice_total]
        queries:
          - "INV-ORION-331 line 1 100 monitors line 2 40 mounts freight 600 tax 2120 total 28620"
      - id: po_and_receipt_match
        slot_kind: contradiction_check
        role: current_state
        purpose: "Compare PO approval and receipt quantities against the invoice."
        required: true
        max_tokens: 1300
        failure_modes: [missing_synthesis, numeric_text_split]
        fields: [po_freight_allowance, received_mounts, backordered_mounts, match_variance]
        queries:
          - "PO-8831 freight allowed 500 received 38 desk mounts 2 backordered invoice 40 mounts"
    fields:
      - id: orion_invoice_id
        label: "Invoice ID"
        expected_status: answerable
        expected_value: "INV-ORION-331"
        evidence:
          - source: "corpus/invoice-orion-331.md"
            heading_path: ["Vendor Invoice INV-ORION-331", "Invoice Header"]
            required_text: "Invoice: INV-ORION-331"
      - id: orion_po_id
        label: "PO ID"
        expected_status: answerable
        expected_value: "PO-8831"
        evidence:
          - source: "corpus/invoice-orion-331.md"
            heading_path: ["Vendor Invoice INV-ORION-331", "Invoice Header"]
            required_text: "PO: PO-8831"
          - source: "corpus/purchase-order-orion.md"
            heading_path: ["Purchase Order PO-8831", "Purchase Order Header"]
            required_text: "PO: PO-8831"
      - id: orion_vendor
        label: "Vendor"
        expected_status: answerable
        expected_value: "Orion Display Supply"
        evidence:
          - source: "corpus/invoice-orion-331.md"
            heading_path: ["Vendor Invoice INV-ORION-331", "Invoice Header"]
            required_text: "Vendor: Orion Display Supply"
      - id: invoice_monitor_line
        label: "Invoice monitor line"
        expected_status: answerable
        expected_value: "100 monitor units at $245.00 each = $24,500.00"
        evidence:
          - source: "corpus/invoice-orion-331.md"
            heading_path: ["Vendor Invoice INV-ORION-331", "Invoice Lines"]
            required_text: "Line 1: 100 monitor units at $245.00 each = $24,500.00"
      - id: invoice_mount_line
        label: "Invoice mount line"
        expected_status: answerable
        expected_value: "40 desk mounts at $35.00 each = $1,400.00"
        evidence:
          - source: "corpus/invoice-orion-331.md"
            heading_path: ["Vendor Invoice INV-ORION-331", "Invoice Lines"]
            required_text: "Line 2: 40 desk mounts at $35.00 each = $1,400.00"
      - id: invoice_freight
        label: "Invoice freight"
        expected_status: answerable
        expected_value: "$600.00"
        evidence:
          - source: "corpus/invoice-orion-331.md"
            heading_path: ["Vendor Invoice INV-ORION-331", "Invoice Lines"]
            required_text: "Freight charge: $600.00"
      - id: invoice_total
        label: "Invoice total"
        expected_status: answerable
        expected_value: "$28,620.00"
        evidence:
          - source: "corpus/invoice-orion-331.md"
            heading_path: ["Vendor Invoice INV-ORION-331", "Invoice Lines"]
            required_text: "Invoice total: $28,620.00"
      - id: po_freight_allowance
        label: "PO freight allowance"
        expected_status: answerable
        expected_value: "$500.00"
        evidence:
          - source: "corpus/purchase-order-orion.md"
            heading_path: ["Purchase Order PO-8831", "Approved Lines"]
            required_text: "Freight allowed up to $500.00"
      - id: received_mounts
        label: "Received mounts"
        expected_status: answerable
        expected_value: "38 desk mounts"
        evidence:
          - source: "corpus/receiving-report-orion.md"
            heading_path: ["Receiving Report RR-8831", "Received Quantities"]
