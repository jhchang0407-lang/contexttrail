  - id: zephyr_bank_change_hold
    title: "Zephyr bank change hold"
    archetype: vendor_onboarding_compliance
    split: stress
    difficulty: 5
    challenge_tags:
      - bank_change_control
      - callback_missing
      - similar_vendor_decoy
      - payment_hold
    failure_modes:
      - wrong_scope
      - absence_hallucination
      - false_completeness
    task_variants:
      - "Can AP release Zephyr Analytics payments after the bank change?"
      - "Find the new account ending, bank letter, callback evidence, and hold reason."
    decoy_sources:
      - "corpus/decoy-similar-vendor.md"
    prompt: "Assemble vendor payment-control context for Zephyr Analytics bank change."
    slots:
      - id: bank_change_identity
        slot_kind: scope_check
        role: identity
        purpose: "Find the bank-change request for the correct current vendor."
        required: true
        max_tokens: 900
        failure_modes: [wrong_scope]
        fields: [bank_change_vendor_id, requested_account_ending]
        queries:
          - "VEN-ZEP-404 Zephyr Analytics bank change account ending 7782"
      - id: bank_change_verification
        slot_kind: missing_check
        role: missing_context
        purpose: "Check whether callback verification is complete and whether payments remain on hold."
        required: true
        max_tokens: 1100
        failure_modes: [absence_hallucination, false_completeness]
        fields: [bank_letter_received, callback_not_recorded, payments_on_hold]
        queries:
          - "bank letter received callback to known vendor contact not recorded payments hold until callback verification complete"
      - id: similar_vendor_exclusion
        slot_kind: scope_check
        role: identity
        purpose: "Confirm the archived similar vendor is not the authority for this bank change."
        required: true
        max_tokens: 900
        failure_modes: [wrong_scope]
        fields: [archived_vendor_different]
        queries:
          - "Zephyr Data Systems archived VEN-ZEP-044 unrelated account ending 7718 not Zephyr Analytics"
    fields:
      - id: bank_change_vendor_id
        label: "Bank change vendor ID"
        expected_status: answerable
        expected_value: "VEN-ZEP-404"
        evidence:
          - source: "corpus/vendor-bank-change.md"
            heading_path: ["Zephyr Bank Change Request", "Request Identity"]
            required_text: "Vendor ID: VEN-ZEP-404"
      - id: requested_account_ending
        label: "Requested account ending"
        expected_status: answerable
        expected_value: "7782"
        evidence:
          - source: "corpus/vendor-bank-change.md"
            heading_path: ["Zephyr Bank Change Request", "Request Identity"]
            required_text: "Requested Account Ending: 7782"
      - id: bank_letter_received
        label: "Bank letter received"
        expected_status: answerable
        expected_value: "received 2026-06-03"
        evidence:
          - source: "corpus/vendor-bank-change.md"
            heading_path: ["Zephyr Bank Change Request", "Verification"]
            required_text: "Bank letter received 2026-06-03"
      - id: callback_not_recorded
        label: "Callback not recorded"
        expected_status: missing
        searched_scope:
          - source: "corpus/vendor-bank-change.md"
            heading_path: ["Zephyr Bank Change Request", "Verification"]
            required_text: "Callback to the known vendor contact is not recorded"
        unsearched_scope:
          - "AP call log outside the supplied packet"
        review_reason: "The bank-change request has no recorded callback to the known vendor contact."
      - id: payments_on_hold
        label: "Payments on hold"
        expected_status: answerable
        expected_value: "payments on hold until callback verification is complete"
        evidence:
          - source: "corpus/vendor-bank-change.md"
            heading_path: ["Zephyr Bank Change Request", "Payment Hold"]
            required_text: "payments on hold until callback verification is complete"
      - id: archived_vendor_different
        label: "Archived vendor different"
        expected_status: missing
        searched_scope:
          - source: "corpus/decoy-similar-vendor.md"
            heading_path: ["Zephyr Data Systems Vendor Profile", "Vendor Identity"]
            required_text: "Vendor ID: VEN-ZEP-044"
          - source: "corpus/decoy-similar-vendor.md"
            heading_path: ["Zephyr Data Systems Vendor Profile", "Bank Details"]
            required_text: "unrelated to Zephyr Analytics LLC"
        unsearched_scope:
          - "Legacy vendor archive outside the supplied packet"
        review_reason: "The similar-name vendor is archived and has a different vendor ID."
