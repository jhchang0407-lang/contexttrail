    task_variants:
      - "A vendor-risk analyst needs the FAR 52.204-21 context before deciding whether a subcontractor system that stores Federal contract information has the minimum safeguards."
      - "Assemble the public FAR safeguarding pack for scope, access controls, media disposal, flaw correction, malware scanning, and subcontract flowdown."
      - "Find the clause language that proves this is about Federal contract information, not ordinary payment-only information."
