    slots:
      - id: far_safeguarding_scope
        slot_kind: evidence
        role: identity
        purpose: "Find the definitions that decide whether the clause applies to a contractor system and Federal contract information."
        required: true
        max_tokens: 1100
        failure_modes: [wrong_scope, shallow_relevance]
        fields:
          - far_fci_definition
          - far_covered_system_definition
          - far_public_payment_info_exclusion
        queries:
          - "FAR 52.204-21 covered contractor information system Federal contract information not intended for public release simple transactional information payment exclusion"
      - id: far_safeguarding_controls
        slot_kind: evidence
        role: rules
        purpose: "Find the minimum basic safeguarding controls most likely to be needed for a vendor checklist."
        required: true
        max_tokens: 1700
        failure_modes: [missing_synthesis, citation_weakness]
        fields:
          - far_authorized_access_control
          - far_external_system_control
          - far_public_system_control
          - far_media_sanitization_control
          - far_flaw_correction_control
          - far_malware_scan_control
        queries:
          - "FAR 52.204-21 basic safeguarding controls authorized users external systems publicly accessible systems media sanitize flaws malicious code scans"
          - "covered contractor information systems minimum security controls access media disposal flaw correction malware periodic scans"
      - id: far_flowdown_and_boundary
        slot_kind: evidence
        role: constraints
        purpose: "Find subcontract flowdown and the warning that the clause does not displace CUI-specific requirements."
        required: true
        max_tokens: 1100
        failure_modes: [missing_synthesis, wrong_scope]
        fields:
          - far_subcontract_flowdown_scope
          - far_cui_other_requirements_warning
        queries:
          - "FAR 52.204-21 subcontract flowdown Federal contract information residing in or transiting through subcontractor information system CUI other requirements"
    fields:
      - id: far_fci_definition
        label: "Federal contract information definition"
        expected_status: answerable
        expected_value: "information not intended for public release, provided by or generated for the Government under a contract"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Definitions"]
            required_text: "Federal contract information means information, not intended for public release"
      - id: far_covered_system_definition
        label: "Covered contractor information system definition"
        expected_status: answerable
        expected_value: "a contractor-owned or operated system that processes, stores, or transmits Federal contract information"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Definitions"]
            required_text: "owned or operated by a contractor that processes, stores, or transmits Federal contract information"
      - id: far_public_payment_info_exclusion
        label: "Public/payment information exclusion"
        expected_status: answerable
        expected_value: "public government information and simple payment-processing transactional information are excluded"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Definitions"]
            required_text: "does not include information provided by the Government to the public"
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Definitions"]
            required_text: "simple transactional information, such as necessary to process payments"
      - id: far_authorized_access_control
        label: "Authorized access control"
        expected_status: answerable
        expected_value: "limit system access to authorized users, processes, or devices"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Basic Safeguarding Controls"]
            required_text: "limiting information system access to authorized users"
      - id: far_external_system_control
        label: "External system control"
        expected_status: answerable
        expected_value: "verify and control or limit connections to and use of external information systems"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Basic Safeguarding Controls"]
            required_text: "controlling or limiting connections to and use of external information systems"
      - id: far_public_system_control
        label: "Public system posting control"
        expected_status: answerable
        expected_value: "control information posted or processed on publicly accessible information systems"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Basic Safeguarding Controls"]
            required_text: "controlling information posted or processed on publicly accessible information systems"
      - id: far_media_sanitization_control
        label: "Media sanitization control"
        expected_status: answerable
        expected_value: "sanitize or destroy media containing Federal Contract Information before disposal or reuse"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Basic Safeguarding Controls"]
            required_text: "sanitizing or destroying information system media containing Federal Contract Information before disposal or release for reuse"
      - id: far_flaw_correction_control
        label: "Flaw correction control"
        expected_status: answerable
        expected_value: "identify, report, and correct information and information system flaws in a timely manner"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Basic Safeguarding Controls"]
            required_text: "identifying, reporting, and correcting information and information system flaws in a timely manner"
      - id: far_malware_scan_control
        label: "Malware and scan control"
        expected_status: answerable
        expected_value: "protect from malicious code, update protections, and perform periodic and real-time scans"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Basic Safeguarding Controls"]
            required_text: "performing periodic scans and real-time scans of files from external sources"
      - id: far_subcontract_flowdown_scope
        label: "Subcontract flowdown scope"
        expected_status: answerable
        expected_value: "flow down the substance of the clause when subcontractor systems may have Federal contract information"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Subcontracts"]
            required_text: "subcontractor may have Federal contract information residing in or transiting through its information system"
      - id: far_cui_other_requirements_warning
        label: "CUI requirements warning"
        expected_status: answerable
        value_kind: judgment
        expected_value: "do not treat FAR 52.204-21 as displacing agency-specific or CUI safeguarding requirements"
        evidence:
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Other Requirements"]
            required_text: "does not relieve the Contractor of any other specific safeguarding requirements"
          - source: "corpus/far-52-204-21-basic-safeguarding.md"
            heading_path: ["FAR 52.204-21 - Basic Safeguarding of Covered Contractor Information Systems", "Other Requirements"]
            required_text: "controlled unclassified information established by Executive Order 13556"

