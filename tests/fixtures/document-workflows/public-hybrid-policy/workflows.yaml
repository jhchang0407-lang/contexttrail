  - id: public_osha_recordability_context_pack
    title: "Public OSHA recordability context pack"
    archetype: case_evidence_adjudication
    split: stress
    difficulty: 6
    challenge_tags:
      - public_source_corpus
      - generated_workflow
      - workplace_incident
      - absence_vs_recordability
      - regulatory_recordkeeping
    failure_modes:
      - missing_synthesis
      - shallow_relevance
      - false_completeness
      - natural_task_wording_failure
    task_variants:
      - "A safety manager needs OSHA context before deciding whether a work-related injury with restricted work and an x-ray visit is recordable."
      - "Build a source-grounded OSHA pack covering the decision tree, recordable triggers, medical treatment boundary, and record retention."
      - "Find the OSHA guidance that distinguishes observation/diagnostic procedures from medical treatment beyond first aid."
      - "Assemble the recordkeeping context needed before completing OSHA Forms 300, 300A, and 301."
    decoy_sources:
      - "corpus/irs-pub-463-accountable-plan-excerpt.md"
      - "corpus/fmla-eligible-employee.md"
    prompt: "Assemble public OSHA recordkeeping context for a generated workplace incident recordability review."
    slots:
      - id: osha_recordkeeping_responsibilities
        slot_kind: evidence
        role: rules
        purpose: "Find who records, which forms are used, annual summary duties, and retention."
        required: true
        max_tokens: 1400
        failure_modes: [shallow_relevance, natural_task_wording_failure]
        fields:
          - osha_covered_employer_recordkeeping
          - osha_forms_used
          - osha_annual_summary_posting
          - osha_five_year_retention
        queries:
          - "OSHA recordkeeping covered employers forms 300 300A 301 post summary February 1 April 30 save five years"
      - id: osha_recordability_triggers
        slot_kind: evidence
        role: evidence
        purpose: "Find the decision tree and general recordability triggers."
        required: true
        max_tokens: 1500
        failure_modes: [missing_synthesis, false_completeness]
        fields:
          - osha_recordability_decision_tree
          - osha_days_away_recordable
          - osha_restricted_work_recordable
          - osha_medical_treatment_recordable
          - osha_recordability_judgment
        queries:
          - "OSHA recordable injury illness work-related new case days away restricted work medical treatment beyond first aid decision tree"
      - id: osha_medical_treatment_boundary
        slot_kind: evidence
        role: exceptions
        purpose: "Find the medical-treatment boundary so diagnostic-only care is not overstated."
        required: true
        max_tokens: 1100
        failure_modes: [override_failure, citation_weakness]
        fields:
          - osha_observation_not_medical_treatment
          - osha_diagnostic_not_medical_treatment
        queries:
          - "OSHA medical treatment does not include observation counseling diagnostic procedures x-rays blood tests first aid"
    fields:
      - id: osha_covered_employer_recordkeeping
        label: "Covered employer recordkeeping responsibility"
        expected_status: answerable
        expected_value: "many employers with 10 or more employees must keep records of occupational injuries and illnesses"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Covered Employer Responsibilities"]
            required_text: "many employers with 10 or more employees are required to keep a record of occupational injuries and illnesses"
      - id: osha_forms_used
        label: "OSHA forms used"
        expected_status: answerable
        expected_value: "OSHA Forms 300, 300A, and 301 or equivalent forms"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Covered Employer Responsibilities"]
            required_text: "using OSHA Forms 300, 300A, and 301 or equivalent forms"
      - id: osha_annual_summary_posting
        label: "Annual summary posting window"
        expected_status: answerable
        expected_value: "post the Form 300A summary from February 1 through April 30"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Covered Employer Responsibilities"]
            required_text: "post the summary in the workplace from February 1 through April 30"
      - id: osha_five_year_retention
        label: "Record retention period"
        expected_status: answerable
        expected_value: "save the OSHA Form 300 Log, privacy case list, Form 300A summary, and Form 301 reports for five years"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Covered Employer Responsibilities"]
            required_text: "save the OSHA Form 300 Log, the privacy case list if one exists, the Form 300A summary, and the OSHA Form 301 Incident Reports for five years"
      - id: osha_recordability_decision_tree
        label: "Recordability decision tree"
        expected_status: answerable
        expected_value: "injury/illness, work-relatedness, new case, and general or specific recording criteria must all be checked"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Recordability Decision Tree"]
            required_text: "decide whether the employee experienced an injury or illness"
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Recordability Decision Tree"]
            required_text: "decide whether the injury or illness meets the general recording criteria"
      - id: osha_days_away_recordable
        label: "Days away trigger"
        expected_status: answerable
        expected_value: "days away from work is a recordable trigger"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Recordable Injury Or Illness"]
            required_text: "recorded if it results in days away from work"
      - id: osha_restricted_work_recordable
        label: "Restricted work trigger"
        expected_status: answerable
        expected_value: "restricted work or transfer to another job is a recordable trigger"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Recordable Injury Or Illness"]
            required_text: "recorded if it results in restricted work, or transfer to another job"
      - id: osha_medical_treatment_recordable
        label: "Medical treatment trigger"
        expected_status: answerable
        expected_value: "medical treatment beyond first aid is a recordable trigger"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Recordable Injury Or Illness"]
            required_text: "recorded if it results in medical treatment beyond first aid"
      - id: osha_observation_not_medical_treatment
        label: "Observation boundary"
        expected_status: answerable
        expected_value: "visits solely for observation or counseling are not medical treatment"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Medical Treatment And First Aid"]
            required_text: "does not include visits to a physician or other licensed health care professional solely for observation or counseling"
      - id: osha_diagnostic_not_medical_treatment
        label: "Diagnostic procedure boundary"
        expected_status: answerable
        expected_value: "x-rays, blood tests, and diagnostic procedures are not medical treatment"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Medical Treatment And First Aid"]
            required_text: "does not include diagnostic procedures such as x-rays and blood tests"
      - id: osha_recordability_judgment
        label: "Generated incident recordability judgment"
        expected_status: answerable
        value_kind: judgment
        expected_value: "if the case is work-related and new, restricted work makes it recordable even if the x-ray visit alone is diagnostic"
        evidence:
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Recordability Decision Tree"]
            required_text: "Work-relatedness is presumed for injuries and illnesses that result from events or exposures in the work environment"
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Recordable Injury Or Illness"]
            required_text: "recorded if it results in restricted work, or transfer to another job"
          - source: "corpus/osha-recordkeeping-recording-excerpt.md"
            heading_path: ["OSHA Recording - Recordkeeping Requirements and Forms", "Medical Treatment And First Aid"]
            required_text: "does not include diagnostic procedures such as x-rays and blood tests"
