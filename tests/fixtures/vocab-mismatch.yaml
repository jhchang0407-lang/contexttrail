# Vocabulary-mismatch recall fixture.
#
# Purpose: measure whether candidate recall survives when the query stops
# sharing vocabulary with the expected document. Each entry pairs a
# self-authored eval query from tests/fixtures/real-corpus/<corpus>.yaml
# (which tends to lexically match the target doc's title/headings) with
# 2-3 paraphrases a nontechnical or hurried user would plausibly type.
# Paraphrases deliberately avoid the distinctive vocabulary of the
# expected document (its title words, the feature's jargon name) while
# keeping the same information need. They are honest human phrasings,
# not adversarial token salad.
#
# Provenance: original_task / expected_top_source / acceptable_top_sources /
# must_include_sources are copied verbatim from the named case in the
# real-corpus fixture; src/eval/vocab-recall.ts cross-checks them at runtime
# and warns on drift. Paraphrases authored 2026-06-12 for the vocab-recall
# measurement (branch engine-improvements).
#
# Selection rules applied:
#   - answer-bearing cases only (no signal_empty),
#   - skipped cases whose query is essentially an exact identifier
#     (e.g. "what does vi.spyOn do", "prisma error code P2002"),
#   - >= 6 corpora, ~5 cases each.

# ── vitest (tests/fixtures/real-corpus/vitest.yaml) ─────────────────────────

# vitest-anchored-mocking — distinctive vocab avoided: "mock", "module"
- corpus: vitest
  case_id: vitest-anchored-mocking
  original_task: "mock a module in a vitest test"
  expected_top_source: "docs/guide/mocking.md"
  acceptable_top_sources: ["docs/guide/mocking.md", "docs/api/vi.md"]
