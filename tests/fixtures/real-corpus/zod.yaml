# Zod v2 holdout panel — sparse README/package docs (8 md files).
# 12 queries: 4 anchored / 3 broad / 2 decision / 0 cross-module / 3 signal-empty.

- id: zod-anchored-package-readme
  task: "use zod to validate a typescript object schema"
  files: ["src/schemas/user.ts"]
  symbols: ["z.object"]
  expected_query_mode: anchored
  expected_signal_empty_warning: false
  expected_top_source: "packages/zod/README.md"
  acceptable_top_sources: ["packages/zod/README.md", "README.md"]
  must_include_sources: ["packages/zod/README.md"]
  notes: "Zod package README"
  query_intent: exact_symbol
  assembly_need: local_semantics
  expectation_kind: deterministic
  capabilities: [anchor_recognition, canonical_source_ranking]

