# Effect-TS OSS holdout panel — functional-effect runtime docs.
# 60 docs (curated slice), 15 unanchored broad-domain queries from a fresh read.
# Probes the EXTREME vocabulary mismatch failure mode: Effect docs use
# heavy domain-specific jargon (Effect, Layer, Fiber, Schedule, Service)
# while user queries use plain-language terms (side-effect, dependency
# injection, retry/backoff, recurring task, singleton). If retrieval can
# bridge that vocabulary gap, it can bridge most.
#
# Source: https://github.com/Effect-TS/website/tree/main/content/src/content/docs/docs

