# Biome OSS holdout panel — toolchain (linter+formatter+assist) docs.
# 79 docs, 15 unanchored broad-domain queries authored from a fresh read.
# Probes the disambiguation failure mode: when a corpus has many similarly
# named pages (lint rule docs), does the right rule surface above its
# near-neighbors? Also probes vocabulary mismatch ("warn on console.log"
# vs rule name "no-console") and config-vs-guide ambiguity.
#
# Source: https://github.com/biomejs/website/tree/main/src/content/docs
# Imported as plain markdown (.mdx renamed to .md).

- id: biome-broad-no-unused-imports
  task: "find unused imports in my project"
  expected_query_mode: unanchored
  expected_signal_empty_warning: false
  expected_top_source: "docs/linter/rules/no-unused-imports.md"
  acceptable_top_sources:
    - "docs/linter/rules/no-unused-imports.md"
  must_include_sources: ["docs/linter/rules/no-unused-imports.md"]
  expected_locked: []
  baseline_ranked_useful: true
  notes: "Disambiguation against the 500+ rule pages neighborhood."
  query_intent: broad_domain
  assembly_need: domain_constraints
  expectation_kind: deterministic
  capabilities: [canonical_source_ranking, distractor_resistance]

