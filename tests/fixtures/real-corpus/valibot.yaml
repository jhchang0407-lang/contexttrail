# Valibot OSS holdout panel — schema validation library docs.
# 31 docs, 15 unanchored broad-domain queries authored from a fresh read
# of the corpus (never tuned against). Probes assembly behavior on a
# corpus ContextTrail has not been engineered for: vocabulary mismatches
# (queries say "compose validators" while docs say "pipe"), parenthesized
# folder grouping conventions, and "what is X" type intro queries.
#
# Source: https://github.com/fabian-hiller/valibot/tree/main/website/src/routes/guides
# Imported as plain markdown (.mdx renamed, .tsx omitted).

- id: valibot-broad-pipelines
  task: "compose multiple validators on a single field in valibot"
  expected_query_mode: unanchored
  expected_signal_empty_warning: false
  expected_top_source: "docs/(main-concepts)/pipelines/index.md"
  acceptable_top_sources:
    - "docs/(main-concepts)/pipelines/index.md"
    - "docs/(main-concepts)/methods/index.md"
  must_include_sources: []
  expected_locked: []
  baseline_ranked_useful: false
  notes: "Vocabulary mismatch — valibot calls this 'pipe', not 'compose validators'."
  query_intent: broad_domain
  assembly_need: domain_constraints
  expectation_kind: deterministic
  capabilities: [canonical_source_ranking, distractor_resistance]

