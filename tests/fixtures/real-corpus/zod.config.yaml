# Repo-configurable corpus import globs.
# Zod's holdout fixture has an internal `wiki/optionality.md` page that the
# defaults do not cover. Declaring import_globs here makes import-surface
# coverage explicit for this corpus.
import_globs:
  - "*.md"
  - "docs/**/*.md"
  - "packages/**/*.md"
  - "wiki/**/*.md"
