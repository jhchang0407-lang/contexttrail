# Valibot library-user workflow eval — generalization test for the
# real-workflow probe. Mirrors the structure of linear-context-assembly.yaml
# but the cases are simulated *library user* workflows on the valibot
# corpus, not engineer-implementing-a-PRD workflows.
#
# Purpose: validate that the same engine (retrieve + link traversal)
# delivers ≥95% workflow assembly on a corpus we never tuned against.
# The 23-ticket ContextTrail panel could be overfit to PRD-style docs.
# Valibot is library docs (different shape) authored by a different
# team with their own link conventions.
#
# Each case names the primary doc the user lands on plus support
# any-of groups — adjacent docs they'd also need to actually do the
# task (a real workflow needs multiple sources).

- ticket: valibot-form-validation
  title: Validate a sign-up form with email + password
  queries:
    - "validate a sign up form with email and password in valibot"
    - "object schema with string fields"
    - "parse user data with validation errors"
  required_primary:
    - "docs/(main-concepts)/parse-data/index.md"
  required_support:
    - - "docs/(schemas)/objects/index.md"
    - - "docs/(main-concepts)/pipelines/index.md"
      - "docs/(main-concepts)/methods/index.md"

