# PRD-0029 / 29.4 — assembly gate CI.
#
# Runs the public-history-safe verdict-emitting eval entrypoints. Any non-zero
# exit fails the build:
#
#   - eval:real-corpus           (PRD-0016 gates — 174-case panel)
#   - eval:real-workflow-context (PRD-0029 workflow-assembly floor)
#
# `eval:agent-completion` is intentionally not run in public CI. It is a
# commit-grounded dogfood benchmark that calls `git show <historical-sha>` for
# private/dev-history commits. The public repo is published as a clean
# single-commit history to avoid shipping large deleted eval artifacts, so those
# historical SHAs are unavailable on GitHub Actions. Run it locally from the
# preserved dev-history branch when validating that benchmark.
#
# Floors are locked in src/eval/assembly-gate-bands.ts and ADR-0021.
# Changing a floor requires the same-commit ADR-0021 amendment.
name: assembly-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build --silent
      - run: npx vitest run

      - name: PRD-0016 release gates (174-case real-corpus panel)
        run: npm run eval:real-corpus --silent

      - name: PRD-0029 workflow-assembly floor (21/23 cases)
        run: npm run eval:real-workflow-context --silent
