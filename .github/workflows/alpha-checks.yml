name: alpha-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build:all --silent
      - run: >
          npx vitest run
          src/package-hygiene.test.ts
          src/cli/import.test.ts
          src/mcp/extraction-warnings.test.ts
          src/mcp/schemas.test.ts
          src/mcp/server.test.ts
          src/ui/server.test.ts
          src/ui/state.test.ts
      - run: npm run eval:document-format-stress --silent
